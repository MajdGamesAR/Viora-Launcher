# ============================================================
#  Viora Launcher — Gradle Properties
# ============================================================

# ===== JVM Settings =====
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# ===== Kotlin =====
kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

# ===== Gradle Performance =====
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# ⚠️ تم حذف org.gradle.java.home — استخدم JAVA_HOME أو Java Toolchain بدلاً منه
# org.gradle.java.home=C:\\Program Files\\Java\\jdk-21.0.11